<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 市場訊號</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#182638;background:#f3f6fa;font-size:16px}*{box-sizing:border-box}body{margin:0}header,main{max-width:1500px;margin:auto;padding:24px}h1{margin:8px 0;font-size:30px}h2{font-size:22px}p{line-height:1.7}a{color:#096b99}nav{display:flex;gap:18px}button,select,input{font:inherit;border:1px solid #bac8d5;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#0c6684;color:white}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:22px;align-items:start}.list,.detail{background:white;border:1px solid #d6e0e9;border-radius:14px;padding:20px}.row{display:block;width:100%;text-align:left;margin-bottom:12px;padding:18px;border:1px solid #d6e0e9}.row strong{font-size:20px}.row small{display:block;margin-top:10px;color:#526278;line-height:1.6}.row[aria-pressed=true] small{color:#e0f0f4}.badge{display:inline-flex;gap:6px;align-items:center;border-radius:6px;padding:5px 9px;background:#edf1f5;color:#455366;font-size:14px}.dot{width:10px;height:10px;border-radius:50%;background:#7a8794;display:inline-block}.muted{color:#526278;font-size:14px}.notice{padding:12px 16px;background:#fff3d9;border-left:4px solid #c17b12;line-height:1.6}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f3f6fa;padding:12px;border-radius:8px}.stat b{display:block;font-size:21px;margin-top:6px}.company{margin-top:18px;padding-top:18px;border-top:1px solid #d6e0e9}.company h3{margin:0 0 10px}.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.reason{padding:12px;background:#eaf4f8;line-height:1.7}details{margin:18px 0}summary{cursor:pointer;font-weight:600}:focus-visible{outline:3px solid #e0931b;outline-offset:3px}@media(max-width:850px){.workspace{grid-template-columns:1fr}header,main{padding:16px}}
</style></head><body><header><nav><a href="signals.html" aria-current="page">市場訊號</a><a href="index.html">供應鏈剖面</a><a href="rings.html">立體爆炸環</a></nav><h1>AI 市場訊號</h1><p>先看產業變化，再看公司數字，最後開啟 K 線。</p><div class="notice">研究測試版 · 行情為既有快照，供需訊號須有近期證據才亮燈。灰燈不代表供給充足，也不是買賣建議。</div></header><main><div class="controls"><button id="short" aria-pressed="true">短波段</button><button id="long" aria-pressed="false">中長期</button><label>搜尋 <input id="search" placeholder="環節、公司或代號"></label><label>供需 <select id="filter"><option value="all">全部狀態</option><option value="tight">吃緊</option><option value="unknown">待確認／過期</option></select></label><button id="reset">清除篩選</button></div><p id="count" role="status"></p><div class="workspace"><section class="list" id="list" aria-label="產業環節"></section><aside class="detail" id="detail" aria-label="環節與公司詳情"></aside></div><details><summary>燈號與更新規則</summary><p>紅：近期直接證據顯示供應吃緊；黃：僅部分規格吃緊；綠：近期證據支持供需平衡；灰：未查證、缺少日期或證據超過 30 天。供需狀態與產品報價分開判斷。紅燈不是買進訊號。</p><p>本頁不自動把新聞標題轉為燈號。供需需要人工核實；股價與財務讀取共用資料。未揭露財報期間時會註明，不能假設是最新季度。</p></details></main>
<script>
const $=s=>document.querySelector(s);
const sectors=[
{id:'pack',name:'CoWoS 與封裝測試',codes:['2330','6640','2360'],watch:'交期、擴產與設備驗收是否改變。',condition:'訂單轉為設備驗收或實際產能利用率，才可能反映在營收。',risk:'擴產超過需求、驗收遞延，或市場估值已提前反映。'},
{id:'cool',name:'液冷與快接頭',codes:['3017','3324','6805'],watch:'關注產品認證、出貨時程與客戶採用，而非只看液冷題材。',condition:'取得認證並量產，且新增收入能覆蓋開發與材料成本。',risk:'認證延期、良率或材料成本壓力。'},
{id:'memory',name:'記憶體與儲存控制器',codes:['2408','8299','3260'],watch:'DRAM、NAND 與控制器分開觀察，顆粒漲價不等於每家公司受惠。',condition:'產品組合、庫存成本與售價傳導共同決定利潤。',risk:'高價壓抑需求、庫存回補結束或控制器客戶縮單。',evidence:{date:'2026-06-24',period:'Micron FY2026 Q3，季度截至 2026-05-28',url:'https://www.sec.gov/Archives/edgar/data/723125/000072312526000015/mu-20260528.htm',text:'美光季度申報指出記憶體與儲存需求增長快於供給，且售價與利潤率改善。僅支持該季背景，不能證明今日所有規格缺貨，也不能直接推論台廠客戶關係。'}},
{id:'board',name:'高速 PCB 與材料',codes:['2383','1802','8155'],watch:'區分玻纖布、CCL 與 PCB；關注規格、認證及材料成本。',condition:'高階產品實際出貨增加，且售價能反映成本。',risk:'材料缺貨妨礙交貨、規格替換或擴產導致供給轉鬆。'},
{id:'power',name:'機櫃電源與備援',codes:['2308','2301','6449'],watch:'看平台規格、電源與零件出貨，不把機櫃功耗直接換算獲利。',condition:'產品升級帶來新增訂單與可維持的毛利。',risk:'導入延後、客戶議價及其他事業稀釋成長。'}];
let state={mode:'short',id:'pack',quotes:{},nodes:new Map()};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,s='')=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('zh-TW',{maximumFractionDigits:2})+s:'未提供';
function render(){const term=$('#search').value.trim().toLowerCase();const rows=sectors.filter(s=>[s.name,...s.codes.map(c=>c+' '+(state.nodes.get(c)?.name||''))].join(' ').toLowerCase().includes(term)&&$('#filter').value!=='tight');$('#count').textContent=`符合 ${rows.length} 個環節／共 5 個 · ${state.mode==='short'?'優先顯示行情與事件':'優先顯示財務與受惠條件'}`;$('#list').innerHTML=rows.length?rows.map(s=>`<button class="row" data-id="${s.id}" aria-pressed="${s.id===state.id}"><strong>${s.name}</strong><p><span class="badge"><i class="dot"></i>${s.evidence?'證據過期 · 待更新':'供需待確認'}</span> <span class="badge">報價方向待確認</span></p><small>${s.watch}</small><small>${s.codes.map(c=>esc(state.nodes.get(c)?.name||c)+' '+c).join(' · ')}</small></button>`).join(''):'<p>沒有符合的環節。尚無通過近期證據檢查的吃緊訊號。</p>';$('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.id=b.dataset.id;render()});if(!rows.length){$('#detail').innerHTML='<h2>沒有符合資料</h2><p>請調整篩選條件。</p>';return}if(!rows.some(s=>s.id===state.id)){state.id=rows[0].id;render();return}detail(rows.find(s=>s.id===state.id));}
function detail(s){const e=s.evidence;$('#detail').innerHTML=`<h2>${s.name}</h2><div class="reason"><b>最新可用證據</b><p>${e?esc(e.text):'尚無完成核實的近期缺貨或漲價依據。保留灰燈。'}</p>${e?`<a href="${e.url}" target="_blank" rel="noopener">原始申報來源</a><p class="muted">發布 ${e.date} · ${e.period} · 超過 30 天，停用亮燈</p>`:''}</div><p><b>受惠條件：</b>${s.condition}</p><p><b>失效條件：</b>${s.risk}</p><p class="muted">以下為研究候選，不代表已證實供應特定客戶。公司關係仍待逐筆驗證。</p>${s.codes.map(c=>{const n=state.nodes.get(c),q=state.quotes[c]||{},symbol=q.symbol;const market=symbol?.endsWith('.TWO')?'TPEX':symbol?.endsWith('.TW')?'TWSE':null;const finance=`<div class="stat">毛利率<b>${num(q.grossPct,'%')}</b></div><div class="stat">營益率<b>${num(q.opPct,'%')}</b></div><div class="stat">近四季本益比<b>${num(q.perTtm)}</b></div><div class="stat">殖利率<b>${num(q.yieldPct,'%')}</b></div>`;const price=`<div class="stat">快照股價 ${esc(q.currency||'TWD')}<b>${num(q.close)}</b></div><div class="stat">快照漲跌幅<b>${num(q.changePct,'%')}</b></div>`;return `<article class="company"><h3>${esc(n?.name||c)} · ${c}</h3><div class="stats">${state.mode==='short'?price+finance:finance+price}</div><p class="muted">報價日期 ${esc(q.asOf||'未提供')} · 非即時。財務數字為 ${esc(q.finPeriod||'期間未提供')} 單季，來自官方營益分析。</p>${state.mode==='short'?`<p>快照相對 20 日均線：${typeof q.aboveMa20==='boolean'?(q.aboveMa20?'上方':'下方'):'未提供'}。量能資料尚未接入。</p>`:''}<div class="links">${market?`<a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(market+':'+c)}" target="_blank" rel="noopener">開啟 ${c} K 線 ↗</a>`:''}${symbol?`<a href="https://finance.yahoo.com/quote/${encodeURIComponent(symbol)}/" target="_blank" rel="noopener">Yahoo 報價 ↗</a>`:''}</div></article>`}).join('')}`;}
// 加時間戳，否則更新完報價還是拿到瀏覽器快取的舊數字
function load(id,url){const el=document.getElementById(id);return el?Promise.resolve(JSON.parse(el.textContent)):fetch(`${url}?t=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('讀取失敗');return r.json()})}
Promise.all([load('chain-data','data/chain.json'),load('quotes-data','data/quotes.json').catch(()=>({quotes:{}}))]).then(([c,q])=>{c.layers.forEach(l=>l.groups.forEach(g=>g.nodes.forEach(n=>state.nodes.set(n.code,n))));state.quotes=q.quotes||{};render()}).catch(()=>{$('#list').textContent='資料載入失敗，請重新整理。'});
['short','long'].forEach(m=>$('#'+m).onclick=()=>{state.mode=m;['short','long'].forEach(x=>$('#'+x).setAttribute('aria-pressed',x===m));render()});$('#search').oninput=render;$('#filter').onchange=render;$('#reset').onclick=()=>{$('#search').value='';$('#filter').value='all';render()};
</script></body></html>
